[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/data",
    "crates/notify",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Investitore Pragmatico"]
license = "MIT"

[workspace.dependencies]
rust_decimal = { version = "1.36", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1.36"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "6.0"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
clap = { version = "4.5", features = ["derive"] }
quick-xml = "0.37"
csv = "1.3"
wiremock = "0.6"
eframe = { version = "0.31", default-features = true }
egui_plot = "0.31"
tray-icon = "0.19"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
float_arithmetic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"